alias: "Home Grocery Stock: AI Control"
mode: single
trigger:
  - platform: state
    entity_id: binary_sensor.fridge_door_contact # Your Aqara sensor
action:
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.fridge_door_contact
            state: "on"
        sequence:
          - service: rest_command.fridge_ai_enable
      - conditions:
          - condition: state
            entity_id: binary_sensor.fridge_door_contact
            state: "off"
        sequence:
          - service: rest_command.fridge_ai_disable
